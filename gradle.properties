org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=false
org.gradle.configuration-cache=true

# NeoForge (21.1.x = Minecraft 1.21.1)
neo_version=21.1.249
moddev_version=2.0.148

# Mod properties
mod_id=cobblegenetics
version=0.1.0-alpha
group=com.cobblegenetics

# Cobblemon 1.7.3 is the compile target (the version used by Cobbleverse / All the Mons).
cobblemon_version=1.7.3+1.21.1

# Only to compile against kotlin.Unit / kotlin.jvm.functions (Cobblemon events are Kotlin); Kotlin for Forge
# provides the runtime.
kotlin_version=2.0.21
# Kotlin for Forge for runClient/runServer only (the version the target server runs)
kff_version=5.12.0

# Optional integrations (compile only)
relics_version=0.12.8
curios_version=9.5.1+1.21.1
